<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sathvika MV — Groceries &amp; provisions, T. Nagar</title>
    <meta
      name="description"
      content="Sathvika MV — order groceries and daily provisions from our family store in T. Nagar, Chennai. Retail delivery and wholesale slabs for shops, canteens and offices."
    />
    <meta name="theme-color" content="#0f7b4f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sathvika MV" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />

  <body>

        <div class="splash-bar"><i></i></div>

      <div class="noscript">
        Sathvika MV needs JavaScript for the ordering app. Please enable it, or call the store on
        <a href="tel:+919840012345">+91 98400 12345</a>.
      </div>

    <div id="app" class="app" hidden></div>
    <div id="overlays"></div>
