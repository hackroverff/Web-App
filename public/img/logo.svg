<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sathvika MV — provisions store crest">
  <title>Sathvika MV</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dd8a"/>
      <stop offset=".42" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8e6a14"/>
    </linearGradient>
    <linearGradient id="maroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a22f40"/>
      <stop offset="1" stop-color="#68121e"/>
    </linearGradient>
    <radialGradient id="field" cx=".5" cy=".42" r=".72">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="1" stop-color="#f6e2b0"/>
    </radialGradient>
    <path id="arcTop" d="M256 282m-158 0a158 158 0 1 1 316 0"/>
    <path id="arcBottom" d="M256 282m132 0a132 132 0 1 1 -264 0"/>
  </defs>

  <!-- crown -->
  <g stroke="#7d5b10" stroke-width="5" stroke-linejoin="round">
    <path d="M162 100 L186 44 L218 78 L256 28 L294 78 L326 44 L350 100 Z" fill="url(#gold)"/>
    <rect x="156" y="92" width="200" height="22" rx="9" fill="url(#gold)"/>
    <circle cx="186" cy="38" r="9" fill="#c9a227"/>
    <circle cx="256" cy="20" r="10" fill="#c9a227"/>
    <circle cx="326" cy="38" r="9" fill="#c9a227"/>
  </g>
  <g fill="#8e1f2e">
    <circle cx="206" cy="103" r="5"/>
    <circle cx="256" cy="103" r="5"/>
    <circle cx="306" cy="103" r="5"/>
  </g>

  <!-- ornate frame + maroon band -->
  <circle cx="256" cy="282" r="196" fill="url(#gold)" stroke="#7d5b10" stroke-width="6"/>
  <circle cx="256" cy="282" r="186" fill="none" stroke="#8e6a14" stroke-width="3" opacity=".55"/>
  <circle cx="256" cy="282" r="172" fill="url(#maroon)" stroke="#4d0d16" stroke-width="4"/>
  <g fill="url(#gold)" stroke="#7d5b10" stroke-width="2">
    <circle cx="72" cy="282" r="8"/><circle cx="440" cy="282" r="8"/>
    <circle cx="118" cy="146" r="7"/><circle cx="394" cy="146" r="7"/>
    <circle cx="118" cy="418" r="7"/><circle cx="394" cy="418" r="7"/>
  </g>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="6" fill="#f6dd8a">
    <textPath xlink:href="#arcTop" href="#arcTop" startOffset="50%" text-anchor="middle">SATHVIKA MV</textPath>
  </text>
  <text font-family="system-ui, sans-serif" font-size="17" letter-spacing="2.5" fill="#e8c877">
    <textPath xlink:href="#arcBottom" href="#arcBottom" startOffset="50%" text-anchor="middle">PROVISIONS · T. NAGAR · SINCE 1994</textPath>
  </text>

  <!-- cream medallion with a provision sack -->
  <circle cx="256" cy="282" r="106" fill="url(#field)" stroke="#c9a227" stroke-width="6"/>
  <circle cx="256" cy="282" r="97" fill="none" stroke="#c9a227" stroke-width="2" opacity=".65"/>
  <g transform="translate(256 274)">
