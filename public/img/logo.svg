    <polygon points="176.0,489.0 178.8,496.1 186.5,496.6 180.6,501.5 182.5,508.9 176.0,504.8 169.5,508.9 171.4,501.5 165.5,496.6 173.2,496.1"/>
    <polygon points="216.0,489.0 218.8,496.1 226.5,496.6 220.6,501.5 222.5,508.9 216.0,504.8 209.5,508.9 211.4,501.5 205.5,496.6 213.2,496.1"/>
    <polygon points="256.0,489.0 258.8,496.1 266.5,496.6 260.6,501.5 262.5,508.9 256.0,504.8 249.5,508.9 251.4,501.5 245.5,496.6 253.2,496.1"/>
    <polygon points="296.0,489.0 298.8,496.1 306.5,496.6 300.6,501.5 302.5,508.9 296.0,504.8 289.5,508.9 291.4,501.5 285.5,496.6 293.2,496.1"/>
    <polygon points="336.0,489.0 338.8,496.1 346.5,496.6 340.6,501.5 342.5,508.9 336.0,504.8 329.5,508.9 331.4,501.5 325.5,496.6 333.2,496.1"/>
